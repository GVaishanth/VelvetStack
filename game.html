<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velvet Stack Game</title><link rel="stylesheet" href="game.css"></head><body><header><a href="index.html" class="logo">♠ VELVET <i>STACK</i></a><a href="index.html" class="back">← Game library</a></header><main><section id="lobby" class="lobby"><p class="eyebrow" id="gameKicker"></p><h1 id="gameTitle"></h1><p id="gameDescription" class="desc"></p><div class="mode-buttons"><button class="mode active" data-mode="solo">Solo table</button><button class="mode" data-mode="online">Online room</button></div><div id="onlineSetup" class="online-setup hidden"><label>Your name<input id="playerName" maxlength="14" value="You"></label><div class="online-row"><button id="hostRoom" class="primary">Host room</button><span>or</span><input id="roomCode" maxlength="6" placeholder="ROOM"><button id="joinRoom" class="secondary">Join</button></div><small>Online play uses a direct browser connection. Share your room code.</small></div><button id="startSolo" class="primary start">Start solo game <span>↗</span></button></section><section id="game" class="game hidden"><div class="game-bar"><div><p class="eyebrow" id="gameBarKicker"></p><h2 id="gameBarTitle"></h2></div><div><span id="roomLabel"></span><button id="restart" class="secondary small">New game</button><a href="index.html" class="secondary small">Exit</a></div></div><div id="status" class="status"></div><div id="board" class="board"></div><div id="handArea" class="hand-area"><div class="hand-label">YOUR CARDS <span id="selectionHint"></span></div><div id="hand" class="hand"></div></div><div id="controls" class="controls"></div></section></main><div id="colorModal" class="bot-modal hidden"><div class="bot-modal-card color-card"><p class="eyebrow">WILD CARD</p><h2>Choose a colour.</h2><p>Pick the colour that the next player must match.</p><div class="color-options"><button data-color="red" class="color-choice red-choice">Red</button><button data-color="yellow" class="color-choice yellow-choice">Yellow</button><button data-color="green" class="color-choice green-choice">Green</button><button data-color="blue" class="color-choice blue-choice">Blue</button></div></div></div><div id="botModal" class="bot-modal hidden"><div class="bot-modal-card"><p class="eyebrow">SOLO TABLE</p><h2>Choose your opponents.</h2><p>How many bot opponents should join your table?</p><label>BOT OPPONENTS (2–8)<input id="botCount" type="number" min="2" max="8" value="2" inputmode="numeric"></label><label>BOT LEVEL<select id="botLevel"><option value="casual">Casual</option><option value="sharp" selected>Sharp</option><option value="pro">Pro</option></select></label><label>BOT SPEED<select id="botSpeed"><option value="turbo" selected>Turbo</option><option value="realistic">Realistic · 2–3 sec</option></select></label><div><button id="cancelBots" class="secondary">Cancel</button><button id="confirmBots" class="primary">Deal the table ↗</button></div></div></div><div id="toast" class="toast"></div><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><script src="game.js"></script></body></html>
